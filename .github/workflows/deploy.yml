name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/clc-ufa

            # Берём ровно то, что в origin/main (без конфликтов локального состояния)
            git fetch --all --prune
            git reset --hard origin/main

            # Чистая установка зависимостей строго по lock-файлу
            npm ci

            # Чистый билд — сбрасываем кэш, чтобы не тащить устаревшие маршруты/ISR
            rm -rf .next
            npm run build

            # standalone не включает public и static — копируем их БЕЗ вложенности
            rm -rf .next/standalone/public .next/standalone/.next/static
            mkdir -p .next/standalone/.next
            cp -r public            .next/standalone/public
            cp -r .next/static       .next/standalone/.next/static
            cp .env                  .next/standalone/.env

            export $(grep -v '^#' .env | xargs)
            pm2 restart clc-ufa --update-env

            # Здоровье после рестарта: localhost должен ответить 200
            sleep 3
            curl -fsS -o /dev/null http://localhost:3000/ && echo "Deploy OK"
          command_timeout: 15m

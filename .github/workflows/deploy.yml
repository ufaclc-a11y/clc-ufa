name: Deploy to Timeweb VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e
            cd /var/www/clc-ufa

            echo "→ Получаем последние изменения..."
            git pull origin main

            echo "→ Пересобираем Docker-образ..."
            docker build \
              --build-arg TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }} \
              --build-arg TG_CHAT_ID=${{ secrets.TG_CHAT_ID }} \
              -t clc-ufa:latest .

            echo "→ Перезапускаем контейнер..."
            docker stop clc-ufa || true
            docker rm   clc-ufa || true
            docker run -d \
              --name clc-ufa \
              --restart unless-stopped \
              -p 3000:3000 \
              -v clc-ufa-image-cache:/app/.next/cache/images \
              -e TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }} \
              -e TG_CHAT_ID=${{ secrets.TG_CHAT_ID }} \
              clc-ufa:latest

            echo "→ Удаляем старые образы..."
            docker image prune -f

            echo "✓ Деплой завершён!"

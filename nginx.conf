# /etc/nginx/sites-available/clc-ufa
# Скопируй этот файл на сервер и сделай symlink в sites-enabled

server {
    listen 80;
    server_name clc-ufa.ru www.clc-ufa.ru;

    # После получения SSL certbot заменит этот блок автоматически
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Кэширование статики Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Кэширование публичных изображений
    location /images/ {
        proxy_pass http://127.0.0.1:3000/images/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
